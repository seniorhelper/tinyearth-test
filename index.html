<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Earth – v4.52 (IWSDK)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{position:fixed;inset:0}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1.5vh;z-index:5;pointer-events:none;padding:3vh 4vw;box-sizing:border-box}
  #card{background:rgba(6,18,40,.86);border:4px solid #7df9ff;border-radius:18px;padding:1.6vh 3vw;text-align:center;color:#fff;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:1.1vh;margin-bottom:1vh}
  #card h1{margin:0;font-size:clamp(30px,4.6vw,56px);line-height:1.05;color:#ffe23a}
  #card p{margin:0;font-size:clamp(17px,2.1vw,26px);line-height:1.25}
  #card .small{font-size:clamp(16px,2vw,24px);color:#bfe9ff}
  #enter{pointer-events:auto;font-size:clamp(24px,3.4vw,42px);font-weight:800;padding:.4em 1.2em;border:5px solid #0b6b3a;background:#2ee88a;color:#06321c;border-radius:16px;cursor:pointer;min-width:55%}
  body:not(.playing) #hint{display:none}
  body.playing #ui{justify-content:flex-end;padding-bottom:64px} body.playing #enter{font-size:16px;min-width:0;padding:8px 16px;border-width:3px;border-radius:6px;opacity:.75}
  body.playing #card h1, body.playing #card p{display:none} body.playing #card{background:none;border:none;padding:0}
  #enter[disabled]{opacity:.5;cursor:default}
  #hint{background:#ffffffee;color:#123;padding:8px 14px;border-radius:6px;font-size:14px;max-width:560px;text-align:center;position:fixed;bottom:10px}
</style>
  <script type="module" crossorigin src="./assets/index-BmQwR-pq.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/light-system-duELFKBM.js">
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="card">
  <h1>Tiny Earth</h1>
  <p>A living world on your table. Play with your hands.</p>
  <button id="enter" disabled>Checking headset…</button>
  <p class="small">Sit at a table. Put your controllers down. Then tap the green button.</p>
  </div>
  <div id="hint">Desktop preview: drag to orbit · hold the mouse on the land to walk · click boulder / volcano · keys 1 2 3 switch characters · M menu</div>
</div>
<script>/* once the game has started (the button is hidden, or this is the desktop preview) the big title card steps aside */
(function(){var b=document.getElementById("enter");function chk(){if(b.style.display==="none"||/Desktop preview/.test(b.textContent))document.body.classList.add("playing");else document.body.classList.remove("playing");}new MutationObserver(chk).observe(b,{attributes:true,childList:true,characterData:true,subtree:true});chk();})();</script>
